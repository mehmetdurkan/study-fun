<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>More Texas History: Gone to Texas!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* "More" practice set: 5 random questions from this week's bank, then the "Want more?" picker (assets/more.js) */
:root{
  --bg:#f4f1ff; --paper:#ffffff; --ink:#221d3a; --muted:#625b80;
  --accent:#6a4ff0; --accent-ink:#fff; --sun:#ffd34d; --sun-ink:#3a2a00;
  --good:#1f9d63; --good-bg:#dcf5e8; --bad:#d4492f; --bad-bg:#fde4de; --line:#dcd5f3;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif; color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15122a; --paper:#201b3a; --ink:#efecfb; --muted:#ada6c9;
  --accent:#a693ff; --accent-ink:#140f2b; --sun:#e8c043; --sun-ink:#221a00;
  --good:#4fd093; --good-bg:#173a2a; --bad:#ff8a73; --bad-bg:#432019; --line:#383160; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15122a; --paper:#201b3a; --ink:#efecfb; --muted:#ada6c9;
  --accent:#a693ff; --accent-ink:#140f2b; --sun:#e8c043; --sun-ink:#221a00;
  --good:#4fd093; --good-bg:#173a2a; --bad:#ff8a73; --bad-bg:#432019; --line:#383160; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.back{color:var(--muted);font-weight:800;text-decoration:none;font-size:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(26px,6vw,36px);margin:0}
.stars{font-family:var(--display);font-size:22px;color:var(--muted)}
.intro{margin:0;color:var(--muted)}
.week{align-self:flex-start;background:var(--sun);color:var(--sun-ink);font-weight:800;font-size:14px;border-radius:999px;padding:2px 12px}
.dots{display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--accent)} .dot.done{background:var(--good)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q{font-family:var(--display);font-size:24px;font-weight:600;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
button.opt{font:inherit;font-weight:800;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:56px;cursor:pointer}
button.opt:focus-visible,.next:focus-visible,.send:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.opt.right{background:var(--good-bg);border-color:var(--good)}
button.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:0;font-weight:700;min-height:1.4em}
.next,.send{font:inherit;font-family:var(--display);font-size:22px;font-weight:700;border:0;border-radius:18px;padding:16px;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;cursor:pointer}
.next[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Mina's activities</a>
  <header><h1>🤠 More Texas History: Gone to Texas!</h1><span class="stars" id="stars">⭐ 0</span></header>
  <span class="week">This week: Americans moving to Texas in the 1820s and the change in 1830</span>
  <p class="intro">5 quick history puzzles about why American families moved to Mexican Texas, and what changed in 1830.</p>
  <div class="dots" id="dots"></div>
  <div class="card" id="card"></div>
</div>
<script src="../../assets/log.js"></script>
<script src="../../assets/more.js"></script>
<script>
const BANK=[{"q": "San Felipe de Austin was an important place in the 1820s. What was it?", "o": ["The main town of Austin’s colony", "A ship that sailed to Mexico", "A Spanish fort far out west"], "a": 0, "why": "Yes! San Felipe de Austin, on the Brazos River, was the center of Austin’s colony. Settlers came there to get land and news."}, {"q": "Who governed Texas in the 1820s?", "o": ["The United States", "Mexico", "France"], "a": 1, "why": "Right! Texas was part of Mexico then."}, {"q": "Stephen F. Austin was…", "o": ["The president of Mexico", "An empresario who brought settlers to Texas", "A Spanish king"], "a": 1, "why": "Yes! An empresario got land in return for bringing settlers."}, {"q": "Austin’s first families were called the “Old ___.”", "o": ["Three Hundred", "Ten Thousand", "Fifty"], "a": 0, "why": "Great! About 300 families: the Old Three Hundred."}, {"q": "Martín de León was another empresario. Which Texas town did his colony start?", "o": ["Victoria", "Dallas", "El Paso"], "a": 0, "why": "Yes! In 1824 Martín de León founded Victoria, near the Guadalupe River. He was one of the few Mexican empresarios."}, {"q": "The Law of April 6, 1830 did what?", "o": ["Made Texas a U.S. state", "Stopped most new American settlers from moving in", "Ended farming"], "a": 1, "why": "Yes! Mexico closed the border to new American settlers."}, {"q": "Why did Mexico pass that law in 1830?", "o": ["It worried Americans would take over Texas", "It wanted more Americans", "It was moving its capital"], "a": 0, "why": "Exactly! By then there were more Americans than Mexicans in Texas."}, {"q": "Settlers grew crops like…", "o": ["Bananas and coffee", "Cotton and corn", "Rice and tea"], "a": 1, "why": "Yes! Cotton and corn grew well in Texas soil."}];
const TITLE=document.querySelector('h1').textContent.replace(/^\S+\s/,'');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// 5 random questions; options shuffled, answer index remapped.
const Q=shuffle(BANK).slice(0,5).map(x=>{const idx=shuffle(x.o.map((_,k)=>k));return {q:x.q,o:idx.map(k=>x.o[k]),a:idx.indexOf(x.a),why:x.why}});
let i=0,score=0;
const card=document.getElementById('card'),dots=document.getElementById('dots'),stars=document.getElementById('stars');
function drawDots(){dots.innerHTML=Q.map((_,k)=>`<span class="dot ${k<i?'done':k===i?'on':''}"></span>`).join('')}
function smsHref(t){t=encodeURIComponent(t);const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);return ios?`sms:&body=${t}`:`sms:?&body=${t}`}
function show(){
  drawDots();
  if(i>=Q.length){
    card.innerHTML=`<p class="q">You got ${score} of ${Q.length} stars! ${score>=4?'🌟 Amazing!':'💪 Nice work!'}</p><a class="send" id="sendScore" href="#">Send Dad my score</a>`;
    document.getElementById('sendScore').href=smsHref(`Mina here! I got ${score}/${Q.length} stars on ${TITLE} 🎉`);
    if(window.studyLog)studyLog('finish',score,Q.length);
    return;
  }
  const x=Q[i];let first=true;
  card.innerHTML=`<p class="q">${x.q}</p><div class="opts">${x.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div><p class="fb" id="fb" aria-live="polite"></p><button class="next" id="next" hidden>Next ➜</button>`;
  let done=false;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;const k=+b.dataset.k;
    if(k===x.a){done=true;b.classList.add('right');if(first){score++;stars.textContent='⭐ '+score}document.getElementById('fb').textContent=x.why;document.getElementById('next').hidden=false;document.getElementById('next').focus()}
    else{first=false;b.classList.add('wrong');b.disabled=true;done=card.querySelectorAll('.opt:not([disabled])').length<=1;document.getElementById('fb').textContent='Hmm, not quite. Try another one!';
      if(done){card.querySelector(`[data-k="${x.a}"]`).classList.add('right');document.getElementById('fb').textContent=x.why;document.getElementById('next').hidden=false}}
  });
  document.getElementById('next').onclick=()=>{i++;show()};
}
show();
</script>
</body>
</html>
