<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mina's Activities</title>
<style>
:root{--bg:#fff8ef;--ink:#2a2140;--muted:#6b5a86;--card:#2c2168;--card2:#5b3fb0;--sun:#ffd54a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:1.5rem 16px 3rem}
.back{color:var(--muted);font-weight:700;text-decoration:none}
h1{font-size:2rem;margin:.4rem 0 .8rem}
h2{font-size:1.1rem;margin:1.6rem 0 .6rem;color:var(--muted)}
a{-webkit-tap-highlight-color:transparent}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid #e6dcf5;background:#fff;color:var(--ink);font:700 .95rem/1 inherit;font-family:inherit;padding:9px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--card2);border-color:var(--card2);color:#fff}
.chip:focus-visible,.tile:focus-visible,.hero:focus-visible,summary:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hero{display:flex;align-items:center;gap:16px;padding:22px 20px;border-radius:24px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--card),var(--card2));box-shadow:0 7px 0 rgba(0,0,0,.15);position:relative}
.hero .emoji{font-size:56px;line-height:1}
.hero .title{font-size:1.5rem;font-weight:800;display:block}
.hero .sub{opacity:.88;font-size:.98rem;display:block}
.tag{display:inline-block;background:var(--sun);color:#3a1d05;font-weight:800;font-size:.75rem;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid #efe6fb;box-shadow:0 4px 0 rgba(44,33,104,.08);position:relative;min-height:104px}
.tile .emoji{font-size:30px;line-height:1}
.tile .title{font-weight:800;font-size:1rem;line-height:1.2}
.tile .when{color:var(--muted);font-size:.8rem}
.done{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#2fb36b;color:#fff;font-weight:900;display:grid;place-items:center;font-size:15px}
.hero .done{top:14px;right:14px;width:32px;height:32px;font-size:18px}
details{background:#fff;border:2px solid #efe6fb;border-radius:18px;margin-bottom:10px}
summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▸";color:var(--muted);transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
details .grid{padding:0 12px 14px}
.empty{color:var(--muted);margin:.4rem 0}
@media (prefers-reduced-motion:no-preference){.hero:active,.tile:active{transform:translateY(2px)}}
</style></head>
<body><div class="wrap">
<p><a class="back" href="../">← Study Fun</a></p>
<h1>Mina's activities</h1>
<div class="filters" id="filters" role="group" aria-label="Show subject"></div>
<div id="view"></div>
<noscript><p>Turn on JavaScript to see the activities.</p></noscript>
</div>
<!-- The page list lives in pages.js. To add a page, add one line there (see README). -->
<script src="pages.js"></script>
<!-- log.js here only says hi to friends and remembers ?who=; data-nolog = this list page sends no rows -->
<script src="../assets/log.js" data-nolog></script>
<script>
(function(){
var PAGES=(window.MINA_PAGES||[]).slice();
var SUBJ={math:['🔢','Math'],science:['🔬','Science'],reading:['📚','Reading'],writing:['✏️','Writing'],social:['🌎','Social Studies']};
var FILTERS=[['all','All','⭐'],['math','Math','🔢'],['science','Science','🔬'],['readwrite','Reading & Writing','📚'],['social','Social Studies','🌎']];
function inFilter(p,f){return f==='all'||p.subject===f||(f==='readwrite'&&(p.subject==='reading'||p.subject==='writing'))}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayCT(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}}
function toUTC(s){var a=s.split('-');return Date.UTC(+a[0],a[1]-1,+a[2])}
function monday(s){var t=toUTC(s),dow=new Date(t).getUTCDay();return t-((dow+6)%7)*864e5}
function nice(t){var d=new Date(t);return MON[d.getUTCMonth()]+' '+d.getUTCDate()}
function slug(u){return u.replace(/\/index\.html$/,'').replace(/\/$/,'').replace(/\.html$/,'')}
var done={};try{done=JSON.parse(localStorage.getItem('studyDone')||'{}')||{}}catch(e){}
function isDone(p){return !!done['mina/'+slug(p.url)]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function icon(p){return (SUBJ[p.subject]||['⭐'])[0]}
function check(p){return isDone(p)?'<span class="done" aria-label="finished">✓</span>':''}
function tile(p){var d=new Date(toUTC(p.date));
  return '<a class="tile" href="'+esc(p.url)+'">'+check(p)+'<span class="emoji" aria-hidden="true">'+icon(p)+'</span><span class="title">'+esc(p.title)+'</span><span class="when">'+DAY[d.getUTCDay()]+' '+nice(toUTC(p.date))+'</span></a>'}
function grid(list){return '<div class="grid">'+list.map(tile).join('')+'</div>'}
PAGES.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
var today=todayCT(),thisWeek=monday(today);
function render(f){
  var v=document.getElementById('view'),h='';
  if(!PAGES.length){v.innerHTML='<p class="empty">New activities are coming soon!</p>';return}
  if(f!=='all'){
    var list=PAGES.filter(function(p){return inFilter(p,f)});
    h=list.length?grid(list):'<p class="empty">No '+esc(FILTERS.filter(function(x){return x[0]===f})[0][1])+' pages yet.</p>';
    v.innerHTML=h;return;
  }
  var top=PAGES[0],s=SUBJ[top.subject]||['⭐',''];
  h+='<a class="hero" href="'+esc(top.url)+'">'+check(top)+'<span class="emoji" aria-hidden="true">'+s[0]+'</span><span><span class="tag">'+(top.date===today?'Today':'Newest')+' · '+esc(s[1])+'</span><span class="title">'+esc(top.title)+'</span>'+(top.blurb?'<span class="sub">'+esc(top.blurb)+'</span>':'')+'</span></a>';
  var rest=PAGES.slice(1),week=rest.filter(function(p){return monday(p.date)===thisWeek}),older=rest.filter(function(p){return monday(p.date)<thisWeek||monday(p.date)>thisWeek});
  if(week.length)h+='<h2>This week</h2>'+grid(week);
  var groups=[],byWeek={};
  older.forEach(function(p){var w=monday(p.date);if(!byWeek[w]){byWeek[w]=[];groups.push(w)}byWeek[w].push(p)});
  if(groups.length){h+='<h2>Past weeks</h2>';groups.forEach(function(w){var l=byWeek[w],n=l.filter(isDone).length;
    h+='<details><summary><span>Week of '+nice(w)+' · '+l.length+' page'+(l.length>1?'s':'')+(n?' · '+n+' ✓':'')+'</span></summary>'+grid(l)+'</details>'})}
  v.innerHTML=h;
}
var cur='all';
try{var saved=sessionStorage.getItem('minaFilter');if(saved&&FILTERS.some(function(x){return x[0]===saved}))cur=saved}catch(e){}
var fb=document.getElementById('filters');
fb.innerHTML=FILTERS.map(function(x){return '<button class="chip" type="button" data-f="'+x[0]+'" aria-pressed="'+(x[0]===cur)+'">'+x[2]+' '+x[1]+'</button>'}).join('');
fb.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.getAttribute('data-f');
  [].forEach.call(fb.children,function(c){c.setAttribute('aria-pressed',String(c===b))});
  try{sessionStorage.setItem('minaFilter',cur)}catch(e){}render(cur)});
render(cur);
})();
</script>
</body></html>
