<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Texas Trail 1825</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#fbf3e6; --paper:#fffdf8; --ink:#33261a; --muted:#7a6650;
  --accent:#b8562d; --accent-ink:#fff; --sun:#ffd34d; --sun-ink:#3a2a00;
  --good:#1f9d63; --good-bg:#dcf5e8; --bad:#c9432b; --bad-bg:#fde4de; --line:#ead9c2;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif; color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d160f; --paper:#2a2017; --ink:#f6ece0; --muted:#c6b19a;
  --accent:#ff8a5c; --accent-ink:#1d160f; --sun:#e8c043; --sun-ink:#221a00;
  --good:#4fd093; --good-bg:#173a2a; --bad:#ff8a73; --bad-bg:#432019; --line:#433427; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d160f; --paper:#2a2017; --ink:#f6ece0; --muted:#c6b19a;
  --accent:#ff8a5c; --accent-ink:#1d160f; --sun:#e8c043; --sun-ink:#221a00;
  --good:#4fd093; --good-bg:#173a2a; --bad:#ff8a73; --bad-bg:#432019; --line:#433427; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.back{color:var(--muted);font-weight:800;text-decoration:none;font-size:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:clamp(28px,6vw,38px);margin:0}
.stars{font-family:var(--display);font-size:22px;color:var(--muted)}
.intro{margin:0;color:var(--muted)}
.trail{display:flex;gap:6px;align-items:center}
.step{flex:1;height:12px;border-radius:999px;background:var(--line)}
.step.on{background:var(--sun)} .step.done{background:var(--good)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;background:var(--sun);color:var(--sun-ink);font-weight:800;font-size:14px;border-radius:999px;padding:2px 12px}
.q{font-family:var(--display);font-size:23px;font-weight:600;margin:0}
.scene{font-size:54px;text-align:center;line-height:1.1}
.opts{display:flex;flex-direction:column;gap:10px}
button.opt{font:inherit;font-weight:800;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:56px;cursor:pointer}
button.opt:focus-visible,.next:focus-visible,.send:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.opt.right{background:var(--good-bg);border-color:var(--good)}
button.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:0;font-weight:700;min-height:1.4em}
.next,.send{font:inherit;font-family:var(--display);font-size:22px;font-weight:700;border:0;border-radius:18px;padding:16px;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;cursor:pointer}
.next[hidden]{display:none}
.ask{font-family:var(--display);font-size:22px;font-weight:600;margin:0}
.choice{display:flex;flex-direction:column;gap:12px}
.choice button{font:inherit;font-family:var(--display);font-size:24px;font-weight:700;min-height:64px;border-radius:18px;border:0;cursor:pointer}
.yes{background:var(--sun);color:var(--sun-ink)}
.no{background:var(--paper);color:var(--ink);border:2px solid var(--line)!important}
.choice button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.talk{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:16px}
.talk h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
.talk p{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Mina's activities</a>
  <header><h1>🤠 Texas Trail 1825</h1><span class="stars" id="stars">⭐ 0</span></header>
  <p class="intro">It's 1825 and your family is thinking about moving to Texas, which belongs to Mexico. Make 5 choices on the trail!</p>
  <div class="trail" id="trail"></div>
  <div class="card" id="card"></div>
  <div class="talk"><h2>💬 Dinner-table question</h2><p>Would YOU have moved to Texas in 1825? Give one reason to go and one reason to stay home.</p></div>
</div>
<script src="../../assets/log.js"></script>
<script src="../../assets/more.js"></script>
<script>
const Q=[
 {tag:'Why go?',scene:'🌾💲',q:'Why did so many American families want to move to Texas in the 1820s?',
  o:['Land was very cheap and there was lots of it','There were big cities with lots of jobs','Texas had the best schools'],a:0,
  why:'Yes! Farmland in Texas cost much less than land back in the United States.'},
 {tag:'Who helped?',scene:'🗺️👨‍🌾',q:'Some leaders brought groups of settler families to Texas. What were they called?',
  o:['Empresarios','Sheriffs','Explorers'],a:0,
  why:'Right! Empresarios like Stephen F. Austin made deals with Mexico to bring in families.'},
 {tag:'The deal',scene:'🤝🇲🇽',q:'To get land, what did Mexico ask the new settlers to do?',
  o:['Pay with gold','Follow Mexico\'s laws and become Mexican citizens','Leave after one year'],a:1,
  why:'Exactly! Settlers promised to follow Mexico\'s laws, and they were expected to join the Catholic church too.'},
 {tag:'Uh-oh, 1830',scene:'📜🚫',q:'By 1830 there were LOTS of Americans in Texas. Mexico got worried. What did it do?',
  o:['Gave away even more free land','Passed a law to stop more Americans from moving in','Moved its capital to Texas'],a:1,
  why:'Yes! The Law of April 6, 1830 said no more new settlers from the United States.'},
 {tag:'How did they feel?',scene:'😠🔥',q:'How do you think the settlers felt about the new 1830 law and new taxes?',
  o:['Happy and thankful','Upset and angry','They didn\'t notice'],a:1,
  why:'Good thinking! Many settlers were upset. That anger grew into the Texas Revolution a few years later.'}
];
const B=[
 {tag:'Bonus: Before 1825',scene:'🇪🇸➡️🇲🇽',q:'In 1821, Mexico became free. Which country used to rule Mexico and Texas?',
  o:['England','Spain','France'],a:1,
  why:'Yes! Mexico won its independence from Spain in 1821, so Texas became part of Mexico.'},
 {tag:'Bonus: The first plan',scene:'👨‍👦📜',q:'Stephen F. Austin took over a plan to bring settlers to Texas. Who started that plan?',
  o:['His father, Moses Austin','The king of Spain','A ship captain'],a:0,
  why:'Right! Moses Austin got permission first, but he died in 1821, so his son Stephen carried on.'},
 {tag:'Bonus: A famous name',scene:'👨‍👩‍👧‍👦×300',q:'Austin\'s first group of settler families got a special nickname. What was it?',
  o:['The Lone Stars','The Old Three Hundred','The Trail Riders'],a:1,
  why:'Yes! About 300 families came first, so they are called the Old Three Hundred.'},
 {tag:'Bonus: Where?',scene:'🏞️💧',q:'Austin\'s colony was along two big Texas rivers. Which ones?',
  o:['The Brazos and the Colorado','The Mississippi and the Ohio','The Nile and the Amazon'],a:0,
  why:'Correct! Rivers gave the farms water and a way to move goods.'},
 {tag:'Bonus: On the farm',scene:'🌱🧺',q:'Many settler farmers grew one crop to sell for money. What was it?',
  o:['Bananas','Cotton','Coffee'],a:1,
  why:'Yes! Cotton grew well in Texas soil and was sold far away.'}
];
let round='main',list=Q,i=0,score=0,mainScore=0;
const card=document.getElementById('card'),trail=document.getElementById('trail'),stars=document.getElementById('stars');
function drawTrail(){trail.innerHTML=list.map((_,k)=>`<span class="step ${k<i?'done':k===i?'on':''}"></span>`).join('')+'<span aria-hidden="true">🏠</span>'}
function smsHref(t){t=encodeURIComponent(t);const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);return ios?`sms:&body=${t}`:`sms:?&body=${t}`}
function log(e,s,t){if(window.studyLog)studyLog(e,s,t)}
function sendBtn(text){return `<a class="send" href="${smsHref(text)}">Send Dad my score</a>`}
function mainEnd(){
  mainScore=score;log('finish',score,Q.length);
  try{localStorage.setItem('texasTrailBest',Math.max(score,+localStorage.getItem('texasTrailBest')||0))}catch(e){}
  card.innerHTML=`<span class="tag">You made it!</span><p class="q">You got ${score} of ${Q.length} stars! ${score>=4?'🌟 Texas history pro!':'🐴 Nice ride, trailblazer!'}</p><p class="ask">Want 5 bonus questions?</p><div class="choice"><button class="yes" id="yes">Yes, more! 🚀</button><button class="no" id="no">I'm done</button></div>`;
  document.getElementById('yes').onclick=()=>{log('extra_yes');round='bonus';list=B;i=0;score=0;stars.textContent='⭐ 0';show()};
  document.getElementById('no').onclick=()=>{log('extra_no');
    card.innerHTML=`<span class="tag">All done!</span><p class="q">You got ${mainScore} of ${Q.length} stars! Great job today 🤠</p>`+sendBtn(`Mina here! I got ${mainScore}/${Q.length} stars on Texas Trail 1825 🎉`)};
  document.getElementById('yes').focus();
}
function bonusEnd(){
  log('extra_finish',score,B.length);
  card.innerHTML=`<span class="tag">Bonus done!</span><p class="q">Bonus round: ${score} of ${B.length} stars! ${score>=4?'🏆 Super trailblazer!':'💪 Way to keep going!'}</p><p class="intro">Main trail: ${mainScore} of ${Q.length}</p>`+sendBtn(`Mina here! I got ${mainScore}/${Q.length} on Texas Trail 1825 and ${score}/${B.length} on the bonus round 🎉`);
}
function show(){
  drawTrail();
  if(i>=list.length){return round==='main'?mainEnd():bonusEnd()}
  const x=list[i];
  card.innerHTML=`<span class="tag">${x.tag}</span><div class="scene" aria-hidden="true">${x.scene}</div><p class="q">${x.q}</p><div class="opts">${x.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div><p class="fb" id="fb" aria-live="polite"></p><button class="next" id="next" hidden>Next ➜</button>`;
  let done=false,first=true;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(done)return;const k=+b.dataset.k;
    if(k===x.a){done=true;b.classList.add('right');if(first){score++;stars.textContent='⭐ '+score}
      document.getElementById('fb').textContent=x.why;const n=document.getElementById('next');n.hidden=false;n.focus()}
    else{first=false;b.classList.add('wrong');b.disabled=true;document.getElementById('fb').textContent='Hmm, not quite. Try another one!'}
  });
  document.getElementById('next').onclick=()=>{i++;show()};
}
show();
</script>
</body>
</html>
