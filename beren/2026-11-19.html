<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beren's Night Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* One phone column: hero, four-verb chart, 5 taps, score */
:root{
  --bg:#eef8f6; --card:#ffffff; --fg:#14302c; --muted:#557570;
  --accent:#0f8f80; --accent2:#e98a2b; --good:#1aa37a; --bad:#c43a52; --line:#d3ebe6;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1d1b; --card:#172a27; --fg:#e7f6f3; --muted:#a3c4be;
  --accent:#3fd0bd; --accent2:#ffb15c; --good:#3ccf9e; --bad:#ff6b7d; --line:#2a433f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1d1b; --card:#172a27; --fg:#e7f6f3; --muted:#a3c4be;
  --accent:#3fd0bd; --accent2:#ffb15c; --good:#3ccf9e; --bad:#ff6b7d; --line:#2a433f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.tag{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2)}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
p{margin:0}
svg{width:100%;height:auto;display:block}
svg text{font-family:var(--body);fill:var(--fg);font-size:13px}
.q{display:flex;flex-direction:column;gap:10px}
.num{font-family:var(--display);font-size:13px;color:var(--muted)}
.prompt{font-weight:800;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{flex:1 1 30%;font:inherit;font-weight:800;font-size:18px;min-height:52px;padding:10px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opts button:disabled{cursor:default}
.why{padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.score{text-align:center}
.big{font-family:var(--display);font-size:44px;font-weight:700;color:var(--accent)}
.send{display:inline-flex;align-items:center;justify-content:center;margin-top:6px;width:100%;min-height:52px;padding:10px 16px;border-radius:14px;text-decoration:none;font-family:var(--display);font-weight:600;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.foot{text-align:center;font-size:13px;color:var(--muted)}
button:focus-visible,.send:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <span class="tag">Spanish · 2-minute quiz</span>
    <h1>The fab four: ir, ser, dar, ver 🌙</h1>
    <p>Four short, irregular preterite verbs. Tap the right form. 5 quick ones, then sleep.</p>
  </section>
  <section class="card">
    <svg viewBox="0 0 340 172" role="img" aria-label="Preterite chart. Ir and ser share the same forms: fui, fuiste, fue, fuimos, fueron. Dar: di, diste, dio, dimos, dieron. Ver: vi, viste, vio, vimos, vieron. No accent marks on any of them.">
      <rect x="4" y="6" width="332" height="62" rx="12" fill="none" stroke="currentColor" stroke-opacity=".25"/>
      <text x="16" y="28" font-weight="800">ir = ser <tspan font-weight="400" fill-opacity=".75">(same forms!)</tspan></text>
      <text x="16" y="52">fui · fuiste · <tspan font-weight="800" fill="#0f8f80">fue</tspan> · fuimos · fueron</text>
      <rect x="4" y="76" width="332" height="62" rx="12" fill="none" stroke="currentColor" stroke-opacity=".25"/>
      <text x="16" y="98"><tspan font-weight="800">dar:</tspan> di · diste · dio · dimos · dieron</text>
      <text x="16" y="124"><tspan font-weight="800">ver:</tspan> vi · viste · vio · vimos · vieron</text>
      <text x="16" y="162" fill-opacity=".75">No accent marks on any of these. <tspan font-weight="800" fill="#e98a2b">dio, vio, fue</tspan></text>
    </svg>
  </section>
  <section class="card q" id="game"></section>
  <section class="card score" id="done" hidden>
    <div class="big" id="big"></div>
    <p id="msg"></p>
    <a class="send" id="sendScore" href="#">Send Dad my score</a>
  </section>
  <p class="foot">Review only. Sleep well!</p>
</div>
<script src="../assets/log.js"></script>
<script src="../assets/wish.js"></script>
<script>
const Q=[
 {p:'Ayer yo ___ al cine. (ir)',o:['fue','fui','di'],a:1,why:'Yo of ir is fui. Fue is él/ella.'},
 {p:'Mi abuela ___ maestra. Which verb is "fue" here?',o:['ir','ser'],a:1,why:'She WAS a teacher, so it is ser. Context tells ir and ser apart.'},
 {p:'El sábado nosotros le ___ un regalo a mamá. (dar)',o:['damos','dimos','dieron'],a:1,why:'Dar takes -er/-ir endings in the preterite: dimos. Damos is present.'},
 {p:'¿Tú ___ la película anoche? (ver)',o:['viste','vistes','vió'],a:0,why:'Tú preterite never ends in -s: viste. And vio has no accent.'},
 {p:'Ellos ___ al partido. (ir)',o:['fueron','fuimos','vieron'],a:0,why:'Ellos of ir is fueron. Fuimos is nosotros.'}
];
let i=0,score=0;const g=document.getElementById('game');
function smsHref(t){t=encodeURIComponent(t);const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);return ios?`sms:&body=${t}`:`sms:?&body=${t}`}
function show(){
  if(i>=Q.length){g.hidden=true;const d=document.getElementById('done');d.hidden=false;
    document.getElementById('big').textContent=`${score}/${Q.length}`;
    document.getElementById('msg').textContent=score>=4?'¡Excelente! The fab four are yours.':'Nice practice. One more look at the chart before bed.';
    document.getElementById('sendScore').href=smsHref(`Beren here: ${score}/${Q.length} on tonight's Spanish fab four quiz`);
    if(window.studyLog)studyLog('finish',score,Q.length);
    try{localStorage.setItem('nn-2026-11-19',score)}catch(e){}return}
  const x=Q[i];
  g.innerHTML=`<span class="num">${i+1} of ${Q.length}</span><p class="prompt">${x.p}</p><div class="opts">${x.o.map((t,k)=>`<button data-k="${k}">${t}</button>`).join('')}</div><p class="why" id="why" hidden></p>`;
  g.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;g.querySelectorAll('.opts button').forEach(z=>z.disabled=true);
    g.querySelector(`[data-k="${x.a}"]`).classList.add('right');
    if(k===x.a)score++;else b.classList.add('wrong');
    const w=document.getElementById('why');w.hidden=false;w.textContent=(k===x.a?'✅ ':'Almost! ')+x.why;
    setTimeout(()=>{i++;show()},1800);
  });
}
show();
</script>
</body>
</html>
