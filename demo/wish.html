<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wish Card Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Demo only: runs the real assets/wish.js with studyLog stubbed, so nothing is sent. */
:root{--bg:#fff7e8;--card:#fff;--fg:#2b2233;--muted:#776c80;--line:#f0e3cc;--accent:#ff7a3d;--accent2:#7b4dff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1622;--card:#2a2232;--fg:#f6eefc;--muted:#bdb0c9;--line:#3d3347;--accent:#ff9a66;--accent2:#a68bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1622;--card:#2a2232;--fg:#f6eefc;--muted:#bdb0c9;--line:#3d3347;--accent:#ff9a66;--accent2:#a68bff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Nunito,system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.note{font-size:14px;color:var(--muted);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:inherit;font-weight:800;border:2px solid var(--line);color:var(--fg);border-radius:999px;padding:8px 14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.pill.on{border-color:var(--accent2)}
h1{font-family:Fredoka,Nunito,sans-serif;font-size:28px;margin:0}
.big{font-family:Fredoka,Nunito,sans-serif;font-size:48px;font-weight:700;color:var(--accent);text-align:center}
#log{font-size:14px;color:var(--muted);white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <p class="note">👀 <b>Demo for Dad.</b> This is the real pop-up, but it sends nothing. On real pages it shows once a day, after the page is finished.</p>
  <div class="card row">
    <a class="pill" id="km" href="?kid=mina">Mina (4th grade)</a>
    <a class="pill" id="kb" href="?kid=beren">Beren (9th grade)</a>
  </div>
  <div class="card">
    <h1>Fraction Feast 🦃</h1>
    <div class="big">4/5</div>
    <p style="text-align:center;margin:0">Great job! Tap Mina or Beren above to see the pop-up again.</p>
  </div>
  <div class="card"><b>What would be logged:</b><p id="log">(nothing yet)</p></div>
</div>
<script>
window.__wishKid = new URLSearchParams(location.search).get('kid') === 'beren' ? 'beren' : 'mina';
document.getElementById(window.__wishKid === 'beren' ? 'kb' : 'km').classList.add('on');
try{ localStorage.removeItem('studyWishDay'); }catch(e){}
var lines = [];
window.studyLog = function(ev, v){
  if(ev === 'finish') return;
  lines.push(ev === 'idea' ? '💡 idea: "' + v + '"' : '⭐ pick: ' + ev.slice(5));
  document.getElementById('log').textContent = lines.join('\n');
};
</script>
<script src="../assets/wish.js"></script>
<script>setTimeout(function(){ studyLog('finish'); }, 300);</script>
</body>
</html>
